name: Auto Update Version History from GitBook

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update-history:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Update Version History table
        run: node .github/scripts/update-version-history.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "chore(docs): tu dong cap nhat bang lich su thay doi [skip ci]"
            git push
          fi
